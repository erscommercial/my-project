<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Map</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --ink: #0f1b2a;
    --ink-deep: #0a131e;
    --brass: #c9a227;
    --brass-soft: #e0c264;
    --teal: #3e6b63;
    --parchment: #f6f1e7;
    --parchment-dim: #d9d2c1;
    --line: rgba(201, 162, 39, 0.25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--parchment);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: 100vh;
    width: 100vw;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--ink-deep);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    z-index: 10;
  }

  .sidebar-header {
    padding: 28px 24px 18px;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0;
    line-height: 1.15;
  }

  .project-list {
    list-style: none;
    margin: 0;
    padding: 8px 0;
    flex: 1;
  }

  .project-item {
    padding: 16px 24px;
    cursor: pointer;
    border-left: 2px solid transparent;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .project-item:hover {
    background: rgba(201, 162, 39, 0.06);
  }

  .project-item.active {
    background: rgba(201, 162, 39, 0.1);
    border-left-color: var(--brass);
  }

  .project-index {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--brass-soft);
  }

  .project-title {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 600;
    margin: 4px 0 4px;
    color: var(--parchment);
  }

  .project-coords {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--parchment-dim);
    letter-spacing: 0.02em;
  }

  .sidebar-footer {
    padding: 14px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--parchment-dim);
    border-top: 1px solid var(--line);
    letter-spacing: 0.04em;
  }

  /* ---------- Map ---------- */
  #map {
    height: 100vh;
    width: 100%;
    background: var(--ink);
  }

  .leaflet-tile-pane { filter: saturate(0.5) brightness(0.85); }

  .brass-pin {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 0 4px rgba(201,162,39,0.2);
    border: 2px solid var(--ink-deep);
    position: relative;
  }

  .brass-pin::after {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid var(--brass);
    opacity: 0;
    animation: pulse 2.4s ease-out infinite;
  }

  .brass-pin.active::after { opacity: 1; }

  @keyframes pulse {
    0% { transform: scale(0.6); opacity: 0.7; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  /* Popup styling */
  .leaflet-popup-content-wrapper {
    background: var(--parchment);
    color: var(--ink-deep);
    border-radius: 4px;
    font-family: 'Space Grotesk', sans-serif;
  }
  .leaflet-popup-tip { background: var(--parchment); }
  .popup-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--teal);
    display: block;
    margin-bottom: 4px;
  }
  .popup-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16px;
    margin: 0 0 6px;
  }
  .popup-desc {
    font-size: 13px;
    line-height: 1.45;
    margin: 0 0 8px;
    color: #2a2a2a;
  }
  .popup-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--teal);
    text-decoration: none;
    border-bottom: 1px solid var(--teal);
  }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 40vh 60vh; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <p class="eyebrow">Field Log — 04 sites</p>
      <h1>Project Atlas</h1>
    </div>
    <ul class="project-list" id="projectList"></ul>
    <div class="sidebar-footer">CLICK A SITE · OR A PIN ON THE MAP</div>
  </aside>

  <div id="map"></div>
</div>

<script>
  const sheetUrl = 'https://script.google.com/macros/s/AKfycbws7ug7xHoyPrP0fJyBzVA7UsdqiVaLGu-UE-OXaDCsrH5Sv6zxaQbe4Z5SpwdYr3S88w/exec';

  const fallbackProjects = [
    {
      title: 'Coastal Renewal Study',
      lat: 38.7223, lng: -9.1393,
      place: 'Lisbon, Portugal',
      desc: 'Tidal infrastructure survey and restoration plan for the estuary waterfront.',
      link: '#'
    },
    {
      title: 'Highland Grid Project',
      lat: -1.2921, lng: 36.8219,
      place: 'Nairobi, Kenya',
      desc: 'Off-grid solar microgrid deployment across three highland districts.',
      link: '#'
    },
    {
      title: 'Delta Housing Initiative',
      lat: -6.2088, lng: 106.8456,
      place: 'Jakarta, Indonesia',
      desc: 'Flood-resilient housing prototypes for river delta communities.',
      link: '#'
    },
    {
      title: 'Northern Lights Archive',
      lat: 69.6492, lng: 18.9553,
      place: 'Tromsø, Norway',
      desc: 'Digital archive and observation deck documenting aurora research.',
      link: '#'
    }
  ];

  const map = L.map('map', { zoomControl: false, worldCopyJump: true })
    .setView([20, 20], 2);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 18
  }).addTo(map);

  const markers = [];
  const pad = n => String(n).padStart(2, '0');
  const listEl = document.getElementById('projectList');
  const eyebrowEl = document.querySelector('.eyebrow');
  let currentProjects = [];

  function coordLabel(lat, lng) {
    const latDir = lat >= 0 ? 'N' : 'S';
    const lngDir = lng >= 0 ? 'E' : 'W';
    return `${Math.abs(lat).toFixed(2)}°${latDir}, ${Math.abs(lng).toFixed(2)}°${lngDir}`;
  }

  function makeIcon(active) {
    return L.divIcon({
      className: '',
      html: `<div class="brass-pin ${active ? 'active' : ''}"></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8],
      popupAnchor: [0, -10]
    });
  }

  function getRowValue(row, ...keys) {
    for (const key of keys) {
      const value = row?.[key];
      if (value !== undefined && value !== null && String(value).trim() !== '') {
        return String(value).trim();
      }
    }
    return '';
  }

  async function loadProjectsFromSheet() {
    const response = await fetch(sheetUrl);
    if (!response.ok) {
      throw new Error(`Apps Script request failed: ${response.status}`);
    }

    const payload = await response.json();
    const rows = Array.isArray(payload) ? payload : (Array.isArray(payload?.data) ? payload.data : []);

    return rows
      .filter(row => getRowValue(row, 'Project Name', 'project name', 'projectName') || getRowValue(row, 'Latitude', 'latitude') || getRowValue(row, 'Longitude', 'longitude') || getRowValue(row, 'Location', 'location'))
      .map(row => {
        const title = getRowValue(row, 'Project Name', 'project name', 'projectName');
        const lat = parseFloat(getRowValue(row, 'Latitude', 'latitude'));
        const lng = parseFloat(getRowValue(row, 'Longitude', 'longitude'));
        const place = getRowValue(row, 'Location', 'location');
        const capacity = getRowValue(row, 'Capacity', 'capacity');
        const progress = getRowValue(row, 'Progress', 'progress');
        const link = getRowValue(row, 'Link', 'link', 'url');
        const descriptionParts = [];

        if (capacity) descriptionParts.push(`Capacity: ${capacity}`);
        if (progress) descriptionParts.push(`Progress: ${progress}`);

        return {
          title,
          lat,
          lng,
          place,
          desc: descriptionParts.join(' · '),
          link: link || '#',
          capacity,
          progress
        };
      })
      .filter(project => Number.isFinite(project.lat) && Number.isFinite(project.lng));
  }

  function renderProjects(projects) {
    currentProjects = projects;
    listEl.innerHTML = '';
    markers.forEach(marker => marker.remove());
    markers.length = 0;

    projects.forEach((p, i) => {
      const marker = L.marker([p.lat, p.lng], { icon: makeIcon(false) }).addTo(map);
      marker.bindPopup(`
        <span class="popup-eyebrow">${p.place}</span>
        <p class="popup-title">${p.title}</p>
        <p class="popup-desc">${p.desc}</p>
        <a class="popup-link" href="${p.link}">View project →</a>
      `);
      markers.push(marker);

      const li = document.createElement('li');
      li.className = 'project-item';
      li.dataset.index = i;
      li.innerHTML = `
        <span class="project-index">${pad(i + 1)} / ${pad(projects.length)}</span>
        <p class="project-title">${p.title}</p>
        <p class="project-coords">${coordLabel(p.lat, p.lng)} · ${p.place}</p>
      `;
      li.addEventListener('click', () => selectProject(i));
      listEl.appendChild(li);

      marker.on('click', () => selectProject(i));
    });

    if (eyebrowEl) {
      eyebrowEl.textContent = `Field Log — ${pad(projects.length)} sites`;
    }

    if (projects.length) {
      selectProject(0);
    }
  }

  function selectProject(i) {
    document.querySelectorAll('.project-item').forEach(el =>
      el.classList.toggle('active', Number(el.dataset.index) === i)
    );
    markers.forEach((m, idx) => m.setIcon(makeIcon(idx === i)));
    const project = currentProjects[i];
    if (project) {
      map.flyTo([project.lat, project.lng], 6, { duration: 0.8 });
    }
    if (markers[i]) {
      markers[i].openPopup();
    }
  }

  async function init() {
    try {
      const projects = await loadProjectsFromSheet();
      renderProjects(projects);
    } catch (error) {
      console.warn('Could not load Apps Script data. Showing fallback sample data instead.', error);
      renderProjects(fallbackProjects);
    }
  }

  init();
</script>

</body>
</html>
