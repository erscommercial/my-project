<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Overview C&I Solar Project Dashboard</title>
  <meta name="description" content="Worldwide commercial and industrial solar project dashboard with capacity, progress, and location data." />
  <meta name="theme-color" content="#065f46" />
  <meta property="og:title" content="Overview C&I Solar Project Dashboard" />
  <meta property="og:description" content="Track commercial and industrial solar projects, capacity, progress, and locations." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f5f8fc;
      --card: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --accent: #0f766e;
      --accent-2: #14b8a6;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; }
    :focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .skip-link { position: absolute; left: 16px; top: -48px; z-index: 1000; padding: 10px 14px; background: #fff; color: #065f46; border-radius: 6px; font-weight: bold; }
    .skip-link:focus { top: 16px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .hero {
      background: linear-gradient(135deg, #0f766e, #065f46, #2563eb);
      color: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      margin-bottom: 20px;
    }
    .hero h1 { margin: 0 0 8px; font-size: clamp(24px, 4vw, 36px); }
    .hero p { margin: 0; opacity: 0.95; }
    .panel {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }
    #map { height: min(55vh, 430px); min-height: 280px; width: 100%; border-radius: 12px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
    .stat { background: #f8fafc; border-radius: 10px; padding: 12px; }
    .stat strong { display: block; font-size: 20px; margin-top: 6px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: 0 6px 16px rgba(0,0,0,0.06); }
    .card h3 { margin: 0 0 8px; font-size: 18px; }
    .card p { margin: 4px 0; color: var(--muted); }
    .pill { display: inline-block; margin-bottom: 8px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: bold; background: #ecfeff; color: #0f766e; }
    .progress-bar { width: 100%; height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #38bdf8); }
    .small { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .status { color: var(--muted); margin: 0 0 12px; }
    .status.error { color: #b91c1c; }
    .data-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    .data-table th, .data-table td { padding: 10px 8px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    .data-table th { color: var(--muted); font-size: 13px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 600px) {
      .hero, .panel, .card { border-radius: 10px; padding: 16px; }
      .data-table { font-size: 14px; }
      .data-table th, .data-table td { padding: 8px 4px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="container">
    <header class="hero">
      <h1>Overview C&I Solar Project</h1>
      <p>View all solar projects with capacity, progress, and live location heat mapping.</p>
    </header>

    <main id="main-content">
    <section class="panel" aria-labelledby="map-heading">
      <h2 id="map-heading">Project Locations Heat Map</h2>
      <p class="status" id="status" role="status" aria-live="polite">Loading project data...</p>
      <div id="map" role="img" aria-label="Interactive map showing solar project locations"></div>
      <div class="stats" id="stats" aria-label="Project summary"></div>
      <div id="accessibleSummary"></div>
    </section>

    <section aria-labelledby="projects-heading">
      <h2 id="projects-heading" class="visually-hidden">Solar projects</h2>
      <div class="grid" id="projectList"></div>
    </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script>
    const sheetUrl = 'https://script.google.com/macros/s/AKfycbws7ug7xHoyPrP0fJyBzVA7UsdqiVaLGu-UE-OXaDCsrH5Sv6zxaQbe4Z5SpwdYr3S88w/exec';

    const fallbackProjects = [
      { 'Project Name': 'Project A', Capacity: '800 kWp', Latitude: '3.1390', Longitude: '101.6869', Progress: '75', Location: 'Kuala Lumpur' },
      { 'Project Name': 'Project B', Capacity: '1200 kWp', Latitude: '2.1896', Longitude: '102.2501', Progress: '60', Location: 'Melaka' },
      { 'Project Name': 'Project C', Capacity: '650 kWp', Latitude: '5.4141', Longitude: '100.3288', Progress: '90', Location: 'Penang' },
      { 'Project Name': 'Project D', Capacity: '950 kWp', Latitude: '1.4655', Longitude: '103.7578', Progress: '45', Location: 'Johor' }
    ];

    function toNumber(value) {
      const num = Number(String(value ?? '').replace(/[^\d.-]/g, ''));
      return Number.isFinite(num) ? num : 0;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }

    function getProjects() {
      return fetch(sheetUrl)
        .then(response => {
          if (!response.ok) throw new Error('Sheet fetch failed');
          return response.json();
        })
        .then(data => Array.isArray(data) && data.length ? data : fallbackProjects)
        .catch(() => fallbackProjects);
    }

    function renderStats(projects) {
      const totalCapacity = projects.reduce((sum, p) => sum + toNumber(p.Capacity), 0);
      const avgProgress = projects.length
        ? Math.round(projects.reduce((sum, p) => sum + toNumber(p.Progress), 0) / projects.length)
        : 0;

      const stats = document.getElementById('stats');
      const numberFormat = new Intl.NumberFormat(navigator.language || 'en');
      stats.innerHTML = `
        <div class="stat"><span>Projects</span><strong>${projects.length}</strong></div>
        <div class="stat"><span>Total Capacity</span><strong>${numberFormat.format(totalCapacity)} kWp</strong></div>
        <div class="stat"><span>Avg Progress</span><strong>${avgProgress}%</strong></div>
      `;
    }

    function renderAccessibleSummary(projects) {
      document.getElementById('accessibleSummary').innerHTML = `
        <table class="data-table">
          <caption class="visually-hidden">Solar project locations, capacity, and progress</caption>
          <thead><tr><th scope="col">Project</th><th scope="col">Location</th><th scope="col">Capacity</th><th scope="col">Progress</th></tr></thead>
          <tbody>${projects.map(project => `<tr><th scope="row">${escapeHtml(project['Project Name'] || 'Unnamed Project')}</th><td>${escapeHtml(project.Location || 'Location not set')}</td><td>${escapeHtml(project.Capacity || 'Not listed')}</td><td>${Math.max(0, Math.min(100, toNumber(project.Progress)))}%</td></tr>`).join('')}</tbody>
        </table>`;
    }

    function renderProjects(projects) {
      const list = document.getElementById('projectList');
      list.innerHTML = '';

      projects.forEach(project => {
        const progress = Math.max(0, Math.min(100, toNumber(project.Progress)));
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <span class="pill">${escapeHtml(project.Location || 'Location not set')}</span>
          <h3>${escapeHtml(project['Project Name'] || 'Unnamed Project')}</h3>
          <p><strong>Capacity:</strong> ${escapeHtml(project.Capacity || 'Not listed')}</p>
          <p><strong>Coordinates:</strong> ${escapeHtml(project.Latitude || 'N/A')}, ${escapeHtml(project.Longitude || 'N/A')}</p>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${progress}%" role="progressbar" aria-label="${escapeHtml(project['Project Name'] || 'Project')} progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"></div>
          </div>
          <div class="small">Progress: ${progress}%</div>
        `;
        list.appendChild(card);
      });
    }

    function renderMap(projects) {
      const map = L.map('map', {
        zoomControl: true,
        scrollWheelZoom: true,
        doubleClickZoom: true
      }).setView([4.2105, 101.9758], 5);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 18
      }).addTo(map);

      const heatPoints = [];
      const markers = [];

      projects.forEach(project => {
        const lat = toNumber(project.Latitude);
        const lng = toNumber(project.Longitude);
        const progress = Math.max(0, Math.min(100, toNumber(project.Progress)));

        if (Number.isFinite(lat) && Number.isFinite(lng)) {
          heatPoints.push([lat, lng, 0.3 + progress / 100]);
          const marker = L.circleMarker([lat, lng], {
            radius: 8 + progress / 20,
            color: '#065f46',
            fillColor: progress >= 80 ? '#16a34a' : '#14b8a6',
            fillOpacity: 0.85,
            weight: 2
          }).addTo(map).bindPopup(`<strong>${escapeHtml(project['Project Name'] || 'Unnamed Project')}</strong><br>Capacity: ${escapeHtml(project.Capacity || 'Not listed')}<br>Progress: ${progress}%`);
          markers.push(marker);
        }
      });

      if (heatPoints.length) {
        L.heatLayer(heatPoints, {
          radius: 35,
          blur: 22,
          max: 1.0,
          gradient: { 0.2: '#fef3c7', 0.5: '#f59e0b', 0.8: '#16a34a', 1.0: '#0f766e' }
        }).addTo(map);
      }

      if (markers.length) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.2));
      }
    }

    getProjects().then(projects => {
      renderStats(projects);
      renderProjects(projects);
      renderAccessibleSummary(projects);
      renderMap(projects);
      document.getElementById('status').textContent = `${projects.length} project${projects.length === 1 ? '' : 's'} loaded.`;
    }).catch(() => {
      document.getElementById('status').textContent = 'Project data could not be loaded. Showing the available local data.';
      document.getElementById('status').className = 'status error';
    });
  </script>
</body>
</html>
